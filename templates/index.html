<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI File Organizer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-gray-800 mb-2">
                    <i class="fas fa-robot mr-2 text-indigo-600"></i>
                    AI File Organizer
                </h1>
                <p class="text-gray-600">Organize your files with AI models and smart indexing</p>
            </div>

            <!-- Main Content -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Left Column - Organization -->
                <div class="lg:col-span-2">
                    <div class="bg-white rounded-lg shadow-lg p-6">
                        <h2 class="text-2xl font-semibold text-gray-800 mb-6 flex items-center">
                            <i class="fas fa-folder-open mr-2 text-indigo-600"></i>
                            File Organization
                        </h2>
                        
                        <form id="organizerForm" class="space-y-6">
                            <div>
                                <label for="folder" class="block text-sm font-medium text-gray-700 mb-2">
                                    <i class="fas fa-folder mr-1"></i>
                                    Folder Path
                                </label>
                                <input type="text" id="folder" name="folder" 
                                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                       placeholder="Enter the folder path to organize">
                            </div>
                            
                            <div>
                                <label for="model" class="block text-sm font-medium text-gray-700 mb-2">
                                    <i class="fas fa-brain mr-1"></i>
                                    AI Model
                                </label>
                                <select id="model" name="model" 
                                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    <option value="llama3">Llama 3 70B (Perplexity)</option>
                                    <option value="gpt4">GPT-4 (OpenAI)</option>
                                    <optgroup label="Local Models (Ollama)" id="ollamaModels">
                                        <!-- Ollama models will be loaded here -->
                                    </optgroup>
                                </select>
                            </div>
                            
                            <div class="flex items-center space-x-4">
                                <label class="flex items-center">
                                    <input type="checkbox" id="use_indexing" name="use_indexing" 
                                           class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                                    <span class="ml-2 text-sm text-gray-700">
                                        <i class="fas fa-database mr-1"></i>
                                        Enable smart indexing
                                    </span>
                                </label>
                            </div>
                            
                            <button type="submit" 
                                    class="w-full bg-indigo-600 text-white py-3 px-4 rounded-md hover:bg-indigo-700 transition duration-200 flex items-center justify-center">
                                <i class="fas fa-search mr-2"></i>
                                Preview Organization
                            </button>
                        </form>
                        
                        <!-- Preview Section -->
                        <div id="previewSection" class="mt-8 hidden">
                            <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                                <i class="fas fa-eye mr-2 text-green-600"></i>
                                Preview of Changes
                            </h3>
                            <div id="previewContent" class="bg-gray-50 p-4 rounded-lg mb-4"></div>
                            <button id="applyChanges" 
                                    class="w-full bg-green-600 text-white py-3 px-4 rounded-md hover:bg-green-700 transition duration-200 flex items-center justify-center">
                                <i class="fas fa-check mr-2"></i>
                                Apply Changes
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Right Column - Search & Stats -->
                <div class="space-y-6">
                    <!-- File Search -->
                    <div class="bg-white rounded-lg shadow-lg p-6">
                        <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                            <i class="fas fa-search mr-2 text-purple-600"></i>
                            Smart Search
                        </h3>
                        
                        <div class="space-y-4">
                            <div>
                                <input type="text" id="searchQuery" 
                                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-purple-500 focus:border-purple-500"
                                       placeholder="Search files by content...">
                            </div>
                            <button id="searchBtn" 
                                    class="w-full bg-purple-600 text-white py-2 px-4 rounded-md hover:bg-purple-700 transition duration-200">
                                <i class="fas fa-search mr-2"></i>
                                Search
                            </button>
                        </div>
                        
                        <div id="searchResults" class="mt-4 hidden">
                            <h4 class="font-medium text-gray-700 mb-2">Search Results:</h4>
                            <div id="searchResultsContent" class="space-y-2"></div>
                        </div>
                    </div>
                    
                    <!-- Index Management -->
                    <div class="bg-white rounded-lg shadow-lg p-6">
                        <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                            <i class="fas fa-database mr-2 text-blue-600"></i>
                            Index Management
                        </h3>
                        
                        <div class="space-y-4">
                            <div>
                                <input type="text" id="indexPath" 
                                       class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                       placeholder="Path to index...">
                            </div>
                            <button id="indexBtn" 
                                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
                                <i class="fas fa-plus mr-2"></i>
                                Index Directory
                            </button>
                        </div>
                        
                        <div id="indexResults" class="mt-4 hidden">
                            <div id="indexResultsContent"></div>
                        </div>
                    </div>
                    
                    <!-- Statistics -->
                    <div class="bg-white rounded-lg shadow-lg p-6">
                        <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                            <i class="fas fa-chart-bar mr-2 text-orange-600"></i>
                            Statistics
                        </h3>
                        
                        <button id="refreshStats" 
                                class="w-full bg-orange-600 text-white py-2 px-4 rounded-md hover:bg-orange-700 transition duration-200 mb-4">
                            <i class="fas fa-refresh mr-2"></i>
                            Refresh Stats
                        </button>
                        
                        <div id="statsContent" class="space-y-3">
                            <div class="text-center text-gray-500">
                                <i class="fas fa-chart-line text-2xl"></i>
                                <p class="mt-2">Click refresh to load statistics</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load Ollama models on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadOllamaModels();
        });

        async function loadOllamaModels() {
            try {
                const response = await axios.get('/ollama/models');
                const models = response.data.models || [];
                const ollamaGroup = document.getElementById('ollamaModels');
                
                models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = `ollama:${model.name}`;
                    option.textContent = `${model.name} (Local)`;
                    ollamaGroup.appendChild(option);
                });
            } catch (error) {
                console.log('Ollama not available or no models found');
            }
        }

        // File organization form handler
        document.getElementById('organizerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            // Add indexing checkbox value
            formData.append('use_indexing', document.getElementById('use_indexing').checked);
            
            try {
                const response = await axios.post('/preview', formData);
                const previewSection = document.getElementById('previewSection');
                const previewContent = document.getElementById('previewContent');

                const formattedPreview = formatPreview(response.data.preview);
                previewContent.innerHTML = formattedPreview;
                
                previewSection.classList.remove('hidden');
            } catch (error) {
                console.error('Error:', error);
                alert('Error getting preview. Please try again.');
            }
        });

        // Apply changes handler
        document.getElementById('applyChanges').addEventListener('click', async () => {
            try {
                const response = await axios.post('/apply', {
                    data: JSON.parse(document.getElementById('previewContent').dataset.preview),
                    folder_path: document.getElementById('folder').value.trim()
                });
                if (response.data.success) {
                    alert('Changes applied successfully!');
                    document.getElementById('previewSection').classList.add('hidden');
                } else {
                    alert('Failed to apply changes. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to apply changes. Please try again.');
            }
        });

        // Search functionality
        document.getElementById('searchBtn').addEventListener('click', async () => {
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) return;
            
            try {
                const response = await axios.post('/search', { query, limit: 10 });
                const results = response.data.results || [];
                const searchResults = document.getElementById('searchResults');
                const searchResultsContent = document.getElementById('searchResultsContent');
                
                if (results.length === 0) {
                    searchResultsContent.innerHTML = '<p class="text-gray-500">No results found.</p>';
                } else {
                    searchResultsContent.innerHTML = results.map(result => `
                        <div class="bg-gray-50 p-3 rounded border">
                            <div class="font-medium text-sm">${result.file_name}</div>
                            <div class="text-xs text-gray-500">${result.file_type} • ${formatFileSize(result.file_size)}</div>
                            <div class="text-xs text-gray-400 mt-1">${result.file_path}</div>
                        </div>
                    `).join('');
                }
                
                searchResults.classList.remove('hidden');
            } catch (error) {
                console.error('Error:', error);
                alert('Search failed. Please try again.');
            }
        });

        // Index directory functionality
        document.getElementById('indexBtn').addEventListener('click', async () => {
            const path = document.getElementById('indexPath').value.trim();
            if (!path) return;
            
            try {
                const response = await axios.post('/index', { directory_path: path });
                const results = response.data.results || {};
                const indexResults = document.getElementById('indexResults');
                const indexResultsContent = document.getElementById('indexResultsContent');
                
                indexResultsContent.innerHTML = `
                    <div class="bg-green-50 p-3 rounded border border-green-200">
                        <div class="text-sm font-medium text-green-800">Indexing Complete</div>
                        <div class="text-xs text-green-600">
                            Success: ${results.success || 0} files<br>
                            Failed: ${results.failed || 0} files
                        </div>
                    </div>
                `;
                
                indexResults.classList.remove('hidden');
            } catch (error) {
                console.error('Error:', error);
                alert('Indexing failed. Please try again.');
            }
        });

        // Statistics functionality
        document.getElementById('refreshStats').addEventListener('click', async () => {
            try {
                const response = await axios.get('/stats');
                const stats = response.data;
                const statsContent = document.getElementById('statsContent');
                
                if (stats.total_files === 0) {
                    statsContent.innerHTML = '<p class="text-gray-500">No files indexed yet.</p>';
                    return;
                }
                
                const typeDistribution = stats.type_distribution || [];
                const typeChart = typeDistribution.map(type => `
                    <div class="flex justify-between items-center py-1">
                        <span class="text-sm text-gray-600">${type.file_type}</span>
                        <span class="text-sm font-medium">${type.count}</span>
                    </div>
                `).join('');
                
                statsContent.innerHTML = `
                    <div class="space-y-2">
                        <div class="flex justify-between items-center py-2 border-b">
                            <span class="text-sm font-medium">Total Files</span>
                            <span class="text-sm">${stats.total_files}</span>
                        </div>
                        <div class="flex justify-between items-center py-2 border-b">
                            <span class="text-sm font-medium">File Types</span>
                            <span class="text-sm">${stats.unique_types}</span>
                        </div>
                        <div class="flex justify-between items-center py-2 border-b">
                            <span class="text-sm font-medium">Total Size</span>
                            <span class="text-sm">${formatFileSize(stats.total_size)}</span>
                        </div>
                        <div class="mt-4">
                            <div class="text-sm font-medium mb-2">Type Distribution:</div>
                            ${typeChart}
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load statistics.');
            }
        });

        // Utility functions
        function formatPreview(preview) {
            if (!preview || typeof preview !== 'object') {
                return '<p>No preview data available</p>';
            }

            const folderGroups = {};

            if (Array.isArray(preview)) {
                preview.forEach(item => {
                    if (item.output_folder && item.file_name) {
                        if (!folderGroups[item.output_folder]) {
                            folderGroups[item.output_folder] = [];
                        }
                        folderGroups[item.output_folder].push(item.file_name);
                    }
                });
            } else {
                Object.entries(preview).forEach(([folder, files]) => {
                    if (Array.isArray(files)) {
                        folderGroups[folder] = files;
                    }
                });
            }

            let formattedHtml = '<ul class="space-y-4">';
            for (const [folder, files] of Object.entries(folderGroups)) {
                formattedHtml += `
                    <li class="bg-white p-4 rounded-lg border">
                        <div class="flex items-center mb-2">
                            <i class="fas fa-folder text-indigo-600 mr-2"></i>
                            <strong class="text-lg text-gray-800">${folder}</strong>
                        </div>
                        <ul class="list-disc list-inside pl-6 space-y-1">
                            ${files.map(file => `<li class="text-sm text-gray-600">${file}</li>`).join('')}
                        </ul>
                    </li>
                `;
            }
            formattedHtml += '</ul>';

            const previewContent = document.getElementById('previewContent');
            previewContent.dataset.preview = JSON.stringify(preview);

            return formattedHtml;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
